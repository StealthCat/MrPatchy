services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DOMAIN: ${DOMAIN:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/mrpatchy.db}
      COOKIE_SECURE: "true"
      DISABLE_SCHEDULER: "1"
      MRPATCHY_EXPECTED_WORKER_IDS: ${MRPATCHY_EXPECTED_WORKER_IDS:-}
      MRPATCHY_DEPLOYMENT_TYPE: docker
      # Trust only our dedicated Caddy hop, never arbitrary management clients.
      FORWARDED_ALLOW_IPS: ${CADDY_CONTROL_IP:-172.30.254.2}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      CADDY_ADMIN: http://caddy:2019
    volumes:
      - app-data:/data
      - tls-config:/tls
    networks:
      control:
        ipv4_address: ${APP_CONTROL_IP:-172.30.254.3}
      management: {}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
  worker:
    build: .
    command: [python, -m, app.worker]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      MRPATCHY_RUNTIME_ROLE: worker
      MRPATCHY_JOB_CONCURRENCY: ${MRPATCHY_JOB_CONCURRENCY:-2}
      MRPATCHY_POLL_CONCURRENCY: ${MRPATCHY_POLL_CONCURRENCY:-8}
      MRPATCHY_DEPLOYMENT_TYPE: docker
      # Set only for a single instance; replicas default to unique boot identities.
      MRPATCHY_WORKER_ID: ${MRPATCHY_WORKER_ID:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/mrpatchy.db}
    volumes:
      - app-data:/data
    networks: [management]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: [caddy, run, --config, /tls/Caddyfile, --adapter, caddyfile]
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
      # Recreate Caddy after app bootstrap when the advertised NAT port changes.
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
    ports:
      - target: 80
        published: "${HTTP_PORT:-80}"
        host_ip: "${HTTP_BIND_IP:-${BIND_IP:-0.0.0.0}}"
        protocol: tcp
      - target: 443
        published: "${HTTPS_PORT:-443}"
        host_ip: "${HTTPS_BIND_IP:-${BIND_IP:-0.0.0.0}}"
        protocol: tcp
      - target: 443
        published: "${HTTPS_PORT:-443}"
        host_ip: "${HTTPS_BIND_IP:-${BIND_IP:-0.0.0.0}}"
        protocol: udp
    volumes:
      - tls-config:/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      control:
        ipv4_address: ${CADDY_CONTROL_IP:-172.30.254.2}
      edge: {}
    security_opt: [no-new-privileges:true]
volumes:
  app-data:
  tls-config:
  caddy-data:
  caddy-config:
networks:
  control:
    internal: true
    ipam:
      config:
        - subnet: ${CONTROL_SUBNET:-172.30.254.0/24}
  management: {}
  edge: {}
