services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DOMAIN: ${DOMAIN:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/mrpatchy.db}
      COOKIE_SECURE: "true"
      DISABLE_SCHEDULER: "1"
      MRPATCHY_EXPECTED_WORKER_IDS: ${MRPATCHY_EXPECTED_WORKER_IDS:-}
      MRPATCHY_AI_HTTP_CONNECTIONS: ${MRPATCHY_AI_HTTP_CONNECTIONS:-16}
      MRPATCHY_DEPLOYMENT_TYPE: docker
      # Trust only our dedicated Caddy hop, never arbitrary management clients.
      FORWARDED_ALLOW_IPS: ${CADDY_CONTROL_IP:-172.30.254.2}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      CADDY_ADMIN: http://caddy:2019
    volumes:
      - app-data:/data
      - tls-config:/tls
    networks:
      control:
        ipv4_address: ${APP_CONTROL_IP:-172.30.254.3}
      management: {}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    # Bound fork bombs; generous for thread pools and subprocess fan-out.
    pids_limit: 1024
    # Bound memory exhaustion; raise via the environment variable on large fleets.
    mem_limit: ${MRPATCHY_APP_MEM_LIMIT:-2g}
    # Immutable root filesystem; writable state is only the named volumes and the /tmp tmpfs.
    read_only: true
    tmpfs: [/tmp]
  worker:
    build: .
    command: [python, -m, app.worker]
    restart: unless-stopped
    # SIGTERM drains active jobs; patch SSH calls may run up to 7500 s, so allow that plus margin
    # instead of Docker's 10 s default, which SIGKILLs the worker mid-operation.
    stop_grace_period: ${MRPATCHY_WORKER_STOP_GRACE_PERIOD:-8100s}
    depends_on:
      app:
        condition: service_healthy
    environment:
      MRPATCHY_RUNTIME_ROLE: worker
      MRPATCHY_REQUIRE_CONTROLLER_STATE: "1"
      MRPATCHY_JOB_CONCURRENCY: ${MRPATCHY_JOB_CONCURRENCY:-2}
      MRPATCHY_POLL_CONCURRENCY: ${MRPATCHY_POLL_CONCURRENCY:-8}
      MRPATCHY_AI_CONCURRENCY: ${MRPATCHY_AI_CONCURRENCY:-4}
      MRPATCHY_AI_HTTP_CONNECTIONS: ${MRPATCHY_AI_HTTP_CONNECTIONS:-16}
      MRPATCHY_DEPLOYMENT_TYPE: docker
      # Set only for a single instance; replicas default to unique boot identities.
      MRPATCHY_WORKER_ID: ${MRPATCHY_WORKER_ID:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/mrpatchy.db}
    volumes:
      - app-data:/data
    networks: [management]
    healthcheck:
      # Passes only while the loop keeps completing registry heartbeats (file in the /tmp tmpfs).
      test: [CMD, python, -m, app.worker_health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    # Bound fork bombs; generous for thread pools and subprocess fan-out.
    pids_limit: 1024
    # Bound memory exhaustion; raise via the environment variable on large fleets.
    mem_limit: ${MRPATCHY_WORKER_MEM_LIMIT:-4g}
    # Immutable root filesystem; writable state is only the named volumes and the /tmp tmpfs.
    read_only: true
    tmpfs: [/tmp]
  caddy:
    image: caddy:2.10@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: [caddy, run, --config, /tls/Caddyfile, --adapter, caddyfile]
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-443}
      # Recreate Caddy after app bootstrap when the advertised NAT port changes.
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
    ports:
      - target: 80
        published: "${HTTP_PORT:-80}"
        host_ip: "${HTTP_BIND_IP:-${BIND_IP:-0.0.0.0}}"
        protocol: tcp
      - target: 443
        published: "${HTTPS_PORT:-443}"
        host_ip: "${HTTPS_BIND_IP:-${BIND_IP:-0.0.0.0}}"
        protocol: tcp
      - target: 443
        published: "${HTTPS_PORT:-443}"
        host_ip: "${HTTPS_BIND_IP:-${BIND_IP:-0.0.0.0}}"
        protocol: udp
    volumes:
      - tls-config:/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      control:
        ipv4_address: ${CADDY_CONTROL_IP:-172.30.254.2}
      edge: {}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]
    pids_limit: 1024
    # Bound memory exhaustion; raise via the environment variable on large fleets.
    mem_limit: ${MRPATCHY_CADDY_MEM_LIMIT:-512m}
    # Immutable root filesystem; Caddy writes only to the /data and /config volumes and /tmp.
    read_only: true
    tmpfs: [/tmp]
volumes:
  app-data:
  tls-config:
  caddy-data:
  caddy-config:
networks:
  control:
    internal: true
    ipam:
      config:
        - subnet: ${CONTROL_SUBNET:-172.30.254.0/24}
  management: {}
  edge: {}
