name: Validate Mr Patchy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Supersede in-progress runs only for the same pull request. Every push to main and
# every manual run gets its own group, so merged commits are always fully verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
# Runner images are pinned (issue #197): moving to Ubuntu 26.04 must be a deliberate,
# validated change rather than an ubuntu-latest label rollover.
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - name: Source version and changelog consistency
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$VERSION_BASE" ] && [ "$VERSION_BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$VERSION_BASE"
            version_args=(--base-ref "$VERSION_BASE")
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              version_args+=(--allow-unversioned)
            fi
            python tools/check_version.py "${version_args[@]}"
          else
            python tools/check_version.py
          fi
      - name: Python undefined names and unused imports
        # Compilation accepts undefined names (issue #121). Pyflakes rules (F) cover undefined
        # names, redefinitions and unused imports; app/db.py:register_models() keeps its
        # side-effect imports with a narrow noqa. Tests are checked for undefined names only.
        run: |
          python -m pip install --quiet -r requirements-lint.txt
          ruff check --no-cache --select F app target scripts tools
          ruff check --no-cache --select F821 tests
      - name: Python byte-compilation
        run: python -m compileall -q app target scripts tools tests
      - name: Shell syntax
        # bash -n checks only its first operand, so check each tracked script separately.
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n
      - name: JavaScript syntax
        run: git ls-files -z '*.js' '*.cjs' | xargs -0 -n1 node --check
      - name: Compose configuration
        run: |
          docker compose --env-file .env.example config --quiet
          GCP_PROJECT=ci-project GCP_ZONE=us-central1-a docker compose --env-file .env.example -f compose.yaml -f compose.gcp.yaml config --quiet

  # Development PRs may retain main's version. This separate merge gate stays red
  # until the coordinator adds a newer version and this PR's changelog entry.
  integration-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Coordinator version and PR traceability
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$VERSION_BASE"
          python tools/check_version.py --base-ref "$VERSION_BASE" --pr-number "$PR_NUMBER"

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      # restic enables the encrypted backup/restore drills in tests/test_final_features.py,
      # which otherwise skip; this replaces the former separate recovery job.
      - name: Native encrypted SQLite recovery tools
        timeout-minutes: 5
        run: |
          bash .github/scripts/configure-ci-apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends restic
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t mrpatchy:test .
      - name: Native Caddy dual-issuer adapter checks
        run: |
          docker create --name mrpatchy-caddy-adapter caddy:2.10
          docker cp mrpatchy-caddy-adapter:/usr/bin/caddy /tmp/mrpatchy-caddy
          docker rm mrpatchy-caddy-adapter
          CADDY_BIN=/tmp/mrpatchy-caddy python -m pytest tests/test_tls_profiles.py -k native_caddy -q
      - name: Compose HTTPS startup smoke test
        run: |
          printf '%s\n' 'ADMIN_PASSWORD=ci-disposable-password-only' 'DOMAIN=localhost' 'PUBLIC_URL=https://localhost' > .env.ci
          docker compose --env-file .env.ci up --build -d --wait
          for attempt in $(seq 1 20); do
            docker compose --env-file .env.ci cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/mrpatchy-ci-root.crt && break
            sleep 1
          done
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors --cacert /tmp/mrpatchy-ci-root.crt https://localhost/healthz
          docker compose --env-file .env.ci exec -T app python -c "from pathlib import Path; uid=next(x.split()[1:] for x in Path('/proc/1/status').read_text().splitlines() if x.startswith('Uid:')); assert uid == ['10001']*4, uid"
      - name: Verify real Caddy client identity and spoof rejection
        run: python tests/integration_proxy.py
      - name: Verify custom bindings and dual TLS profiles
        run: python tests/integration_tls.py
      - name: Compose diagnostics and cleanup
        if: always()
        run: |
          if [ -f .env.ci ]; then
            docker compose --env-file .env.ci logs --tail=100
            docker compose --env-file .env.ci down -v
          fi

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The serial MySQL suite took ~21 minutes; each shard gets its own runner and
        # database. tests/conftest.py assigns whole test files to shards.
        shard: [1, 2, 3, 4]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-password
          MYSQL_DATABASE: mrpatchy_test
          MYSQL_USER: mrpatchy_test
          MYSQL_PASSWORD: disposable-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://mrpatchy_test:disposable-test-password@127.0.0.1:3306/mrpatchy_test?charset=utf8mb4
      MRPATCHY_TEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Native encrypted MySQL recovery tools
        timeout-minutes: 5
        run: |
          bash .github/scripts/configure-ci-apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends restic mariadb-client
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ssh-enrollment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ['ubuntu:24.04', 'debian:bookworm-slim']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install native Debian fixture signing tools
        timeout-minutes: 5
        run: |
          bash .github/scripts/configure-ci-apt.sh
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gnupg
      - run: pip install -r requirements.txt
      - run: docker build --build-arg TARGET_BASE=${{ matrix.target }} -f tests/fixtures/Dockerfile.ssh -t mrpatchy-ssh-test tests/fixtures
      - run: python tests/integration_ssh.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Install browser system dependencies
        timeout-minutes: 5
        run: |
          bash .github/scripts/configure-ci-apt.sh
          npx playwright install-deps chromium
      - name: Download Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: npm run test:ui

  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ['fedora:44', 'almalinux:9']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Native RPM fixture tools
        timeout-minutes: 5
        run: |
          bash .github/scripts/configure-ci-apt.sh
          sudo apt-get update && sudo apt-get install -y python3-dnf python3-rpm python3-venv rpm
      - run: /usr/bin/python3 -m venv --system-site-packages /tmp/patchy-rpm-test
      - run: /tmp/patchy-rpm-test/bin/pip install -r requirements-dev.txt
      # These run against the runner's own libdnf/libRPM and do not depend on the
      # matrix target, so run them once rather than in every leg.
      - name: Native libdnf/libRPM tests
        if: matrix.target == 'fedora:44'
        run: /tmp/patchy-rpm-test/bin/python -m pytest tests/test_rpm.py tests/test_rpm_native.py tests/test_vendor_rpm.py -q
      - run: docker build --build-arg TARGET_BASE=${{ matrix.target }} -f tests/fixtures/Dockerfile.rpm -t mrpatchy-ssh-test tests/fixtures
      - run: /tmp/patchy-rpm-test/bin/python tests/integration_ssh.py

  gcp-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t mrpatchy:base .
      - run: docker build -f deploy/Dockerfile.gcp -t mrpatchy:gcp .
      - name: Verify unprivileged Google CLI runtime
        run: |
          docker run --rm mrpatchy:gcp gcloud version
          test "$(docker run --rm mrpatchy:gcp id -u)" = 10001
      - name: Verify GCP checks coexist with the running app
        run: |
          printf '%s\n' 'ADMIN_PASSWORD=ci-disposable-password-only' 'DOMAIN=localhost' 'PUBLIC_URL=https://localhost' > .env
          printf '%s\n' 'GCP_PROJECT=ci-project' 'GCP_ZONE=us-central1-a' > .env.gcp
          bash ./gcp-compose.sh up -d --no-build --wait
          # Repeat temporary checks while the real app owns its fixed control IP.
          for attempt in 1 2; do
            bash ./gcp-compose.sh run --rm --no-deps worker gcloud version
            test "$(bash ./gcp-compose.sh run --rm --no-deps worker id -u)" = 10001
          done
          for service in app worker; do
            bash ./gcp-compose.sh exec -T --user mrpatchy -e HOME=/home/mrpatchy "$service" gcloud version
            test "$(bash ./gcp-compose.sh exec -T --user mrpatchy -e HOME=/home/mrpatchy "$service" id -u)" = 10001
          done
      - name: GCP runtime diagnostics and cleanup
        if: always()
        run: |
          if [ -f .env ] && [ -f .env.gcp ]; then
            bash ./gcp-compose.sh logs --tail=100
            bash ./gcp-compose.sh down -v
          fi
