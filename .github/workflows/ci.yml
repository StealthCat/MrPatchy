name: Validate Mr Patchy
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: mrpatchy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app target
      - run: bash -n deploy/entrypoint.sh
      - run: node --check app/static/app.js
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t mrpatchy:test .
      - name: Compose HTTPS startup smoke test
        run: |
          printf '%s\n' 'ADMIN_PASSWORD=ci-disposable-password-only' 'DOMAIN=localhost' 'PUBLIC_URL=https://localhost' > .env.ci
          docker compose --env-file .env.ci up --build -d --wait
          for attempt in $(seq 1 20); do
            docker compose --env-file .env.ci cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/mrpatchy-ci-root.crt && break
            sleep 1
          done
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors --cacert /tmp/mrpatchy-ci-root.crt https://localhost/healthz
          docker compose --env-file .env.ci exec -T app python -c "from pathlib import Path; uid=next(x.split()[1:] for x in Path('/proc/1/status').read_text().splitlines() if x.startswith('Uid:')); assert uid == ['10001']*4, uid"
      - name: Verify real Caddy client identity and spoof rejection
        run: python tests/integration_proxy.py
      - name: Compose diagnostics and cleanup
        if: always()
        run: |
          if [ -f .env.ci ]; then
            docker compose --env-file .env.ci logs --tail=100
            docker compose --env-file .env.ci down -v
          fi
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-password
          MYSQL_DATABASE: mrpatchy_test
          MYSQL_USER: mrpatchy_test
          MYSQL_PASSWORD: disposable-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pdisposable-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://mrpatchy_test:disposable-test-password@127.0.0.1:3306/mrpatchy_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  ssh-enrollment:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ['ubuntu:24.04', 'debian:bookworm-slim']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: docker build --build-arg TARGET_BASE=${{ matrix.target }} -f tests/fixtures/Dockerfile.ssh -t mrpatchy-ssh-test .
      - run: python tests/integration_ssh.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_final_features.py -q
