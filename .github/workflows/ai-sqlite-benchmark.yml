name: Native capped AI benchmark
on:
  workflow_dispatch:
    inputs:
      slow_paced_provider:
        description: Use 4,500 ms loopback responses for the cross-server paced fixture
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/ai-sqlite-benchmark.yml'

permissions:
  contents: read

jobs:
  capped-fixture:
    name: Capped fixture (${{ matrix.database }}, ${{ matrix.layout }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BENCHMARK_PROVIDER_DELAY: ${{ matrix.layout == 'cross-server-paced' && inputs.slow_paced_provider && '4500' || '150' }}
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
        layout: [cross-server, same-server, cross-server-paced]
        include:
          - layout: cross-server
            hosts: 8
            artifact-suffix: ''
            control-mode: daily_cap
          - layout: same-server
            hosts: 1
            artifact-suffix: -same-server
            control-mode: daily_cap
          - layout: cross-server-paced
            hosts: 8
            artifact-suffix: -paced
            control-mode: rate_and_daily
            starts-per-hour: 1000
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-password
          MYSQL_DATABASE: mrpatchy_benchmark
          MYSQL_USER: mrpatchy_benchmark
          MYSQL_PASSWORD: disposable-benchmark-password
        ports: ['3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # PRs validate the workflow using the exact base. Manual runs use the selected ref.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Install fixture dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements.lock
      - name: Capture and validate six paired runs
        shell: bash
        env:
          BENCHMARK_DATABASE: ${{ matrix.database }}
          BENCHMARK_HOSTS: ${{ matrix.hosts }}
          BENCHMARK_CONTROL_MODE: ${{ matrix.control-mode }}
          BENCHMARK_RATE: ${{ matrix.starts-per-hour }}
          BENCHMARK_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: |
          BENCHMARK_DIR="$RUNNER_TEMP/ai-${BENCHMARK_DATABASE}-benchmark"
          mkdir -p "$BENCHMARK_DIR"
          if [[ "$BENCHMARK_DATABASE" == mysql ]]; then
            : "${BENCHMARK_MYSQL_PORT:?Missing fixture MySQL port}"
            export AI_BENCHMARK_MYSQL_URL="mysql+pymysql://mrpatchy_benchmark:disposable-benchmark-password@127.0.0.1:$BENCHMARK_MYSQL_PORT/mrpatchy_benchmark"
          fi
          {
            git log -1 --format='commit=%H'
            uname -srm
            python -VV
            printf 'database=%s\n' "$BENCHMARK_DATABASE"
            printf 'fixture_hosts=%s\n' "$BENCHMARK_HOSTS"
            printf 'ai_control_mode=%s\n' "$BENCHMARK_CONTROL_MODE"
            printf 'provider_delay_ms=%s\n' "$BENCHMARK_PROVIDER_DELAY"
            if [[ -n "$BENCHMARK_RATE" ]]; then
              printf 'starts_per_hour=%s\n' "$BENCHMARK_RATE"
            fi
            if [[ "$BENCHMARK_DATABASE" == sqlite ]]; then
              python -c 'import fcntl, sqlite3; print("flock=" + fcntl.flock.__module__); print("sqlite=" + sqlite3.sqlite_version)'
            fi
            python -m pip freeze
          } > "$BENCHMARK_DIR/provenance.txt"

          workload=(--database "$BENCHMARK_DATABASE" --control-mode "$BENCHMARK_CONTROL_MODE" --runs 8
                    --servers "$BENCHMARK_HOSTS"
                    --provider-delay-ms "$BENCHMARK_PROVIDER_DELAY" --ssh-delay-ms 50 --persistence-delay-ms 15
                    --retained-history-rows 1000)
          if [[ -n "$BENCHMARK_RATE" ]]; then
            workload+=(--rate-per-hour "$BENCHMARK_RATE")
          fi
          pairs=()
          for pair in {1..6}; do
            if (( pair % 2 )); then
              order=(1 4)
            else
              order=(4 1)
            fi
            for workers in "${order[@]}"; do
              echo "Running pair $pair with $workers worker slots"
              python tools/benchmark_ai.py "${workload[@]}" --concurrency "$workers" \
                > "$BENCHMARK_DIR/pair-${pair}-slots-${workers}.json"
            done
            pairs+=(--pair "$BENCHMARK_DIR/pair-${pair}-slots-1.json"
                           "$BENCHMARK_DIR/pair-${pair}-slots-4.json")
          done
          python tools/compare_ai_benchmark_series.py "${pairs[@]}" > "$BENCHMARK_DIR/series.json"
          python - "$BENCHMARK_DIR/series.json" "$BENCHMARK_HOSTS" "$BENCHMARK_CONTROL_MODE" "$BENCHMARK_RATE" "$BENCHMARK_PROVIDER_DELAY" <<'PY'
          import json
          import sys
          from pathlib import Path

          series = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_hosts = int(sys.argv[2])
          expected_mode = sys.argv[3]
          expected_rate = int(sys.argv[4]) if sys.argv[4] else None
          expected_provider_delay = int(sys.argv[5])
          for mode in ("serial", "parallel"):
              side = series[mode]
              if side["fixture_hosts"] != expected_hosts:
                  raise SystemExit(f"{mode}: expected {expected_hosts} fixture hosts")
              if side["ai_control_mode"] != expected_mode:
                  raise SystemExit(f"{mode}: expected {expected_mode} AI control mode")
              if side.get("fixture_rate", {}).get("starts_per_hour") != expected_rate:
                  raise SystemExit(f"{mode}: expected starts_per_hour={expected_rate}")
              if side.get("provider_delay_ms") != expected_provider_delay:
                  raise SystemExit(f"{mode}: expected provider_delay_ms={expected_provider_delay}")
          PY
      - name: Upload validated captures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-capped-${{ matrix.database }}-ai-benchmark${{ matrix.artifact-suffix }}${{ env.BENCHMARK_PROVIDER_DELAY == '4500' && '-slow-provider' || '' }}
          path: ${{ runner.temp }}/ai-${{ matrix.database }}-benchmark/
          if-no-files-found: error
          retention-days: 30
